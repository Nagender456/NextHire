name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m ruff check backend
      - run: python -m ruff format --check backend
      - run: python -m pytest backend/tests
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start API for browser smoke tests
        working-directory: .
        run: |
          python -m pip install -r backend/requirements.txt
          CORS_ALLOWED_ORIGINS=http://127.0.0.1:4173 PYTHONPATH=backend python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/nexthire-api.log 2>&1 &
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:8000/health && exit 0; sleep 1; done
          cat /tmp/nexthire-api.log
          exit 1
      - run: npm run test:e2e
        env:
          VITE_API_URL: http://127.0.0.1:8000
      - run: npm audit --audit-level=high

  container-validation:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f infrastructure/docker-compose.yml config
      - run: docker build -f infrastructure/docker/backend.Dockerfile .
      - run: docker build -f infrastructure/docker/worker.Dockerfile .
      - run: docker build -f infrastructure/docker/frontend.Dockerfile .
